<body>
<div class="ambient-light"></div>

<div class="container">
  <div class="hud-wrapper">
    <div class="hud-inner">
      
      <header>
        <div class="title-group">
          <div class="sys-id">SECURE.DB.TERMINAL // v2.0</div>
          <h1>KEYWORD<br><span style="color:var(--text-main)">ACCESS</span></h1>
        </div>
        <div class="status-indicator">
          <div class="blink-dot"></div>
          SYS.ONLINE
        </div>
      </header>

      <main>
        <div class="control-grid">
          <div class="input-group">
            <label for="date">TARGET DATE</label>
            <input id="date" type="date">
          </div>
          <div class="input-group">
            <label for="period">TARGET PERIOD</label>
            <select id="period">
              <option value="1">1限目 - PERIOD 01</option>
              <option value="2">2限目 - PERIOD 02</option>
              <option value="3">3限目 - PERIOD 03</option>
            </select>
          </div>
        </div>

        <button id="searchBtn" class="btn-main" type="button">INITIALIZE QUERY // 検索開始</button>

        <div class="quick-actions">
          <button type="button" class="btn-quick" data-period="1">SET P.01</button>
          <button type="button" class="btn-quick" data-period="2">SET P.02</button>
          <button type="button" class="btn-quick" data-period="3">SET P.03</button>
          <button type="button" class="btn-quick" id="todayBtn">SET TODAY</button>
        </div>

        <div class="display-screen" id="result">
          <div class="sys-msg">AWAITING INPUT PARAMETERS...</div>
        </div>
      </main>
      
    </div>
  </div>
  <footer>DATA SOURCE : GOOGLE APPS SCRIPT // SYSTEM VER 2.0.4</footer>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbwrWI6InMFBv_3Q1Uy3gY39xfYF9Ow4b6c5DUSkn_zeMYgJ6hQ2vZK4iVkYNF0iN_FU/exec";

const dateInput = document.getElementById("date");
const periodInput = document.getElementById("period");
const resultDisplay = document.getElementById("result");
const searchBtn = document.getElementById("searchBtn");

// Event Listeners
searchBtn.addEventListener("click", searchKeyword);
document.querySelectorAll("[data-period]").forEach(btn => {
  btn.addEventListener("click", () => setPeriod(btn.dataset.period));
});
document.getElementById("todayBtn").addEventListener("click", setToday);

function pad(n){ return String(n).padStart(2,"0"); }

function setToday(){
  const d = new Date();
  dateInput.value = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

function setPeriod(p){
  periodInput.value = String(p);
  searchKeyword();
}

// Hacker Text Effect (Decipher Animation)
const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*";
function playHackerEffect(element, finalString) {
  let iterations = 0;
  const maxIterations = 15; // Animation duration control
  
  const interval = setInterval(() => {
    element.innerText = finalString
      .split("")
      .map((char, index) => {
        if(char === " ") return " ";
        if(index < iterations - maxIterations / 2) return char; // Reveal true char gradually
        return charset[Math.floor(Math.random() * charset.length)];
      })
      .join("");
    
    if(iterations >= finalString.length + maxIterations){
      clearInterval(interval);
      element.innerText = finalString; // Ensure exact match at the end
    }
    iterations += 1/2; // Speed control
  }, 30);
}

// Main Search Function
async function searchKeyword(){
  const date = dateInput.value;
  const period = periodInput.value;

  if(!date){
    resultDisplay.innerHTML = `
      <div class="result-data">
        <div class="error-msg">ERR // INPUT_REQUIRED</div>
        <div class="error-desc">TARGET DATE MUST BE SPECIFIED.</div>
      </div>`;
    return;
  }

  // Set Loading State
  searchBtn.disabled = true;
  searchBtn.innerText = "PROCESSING...";
  resultDisplay.innerHTML = `
    <div class="loading-container">
      <div class="loading-text">CONNECTING TO DATABASE...</div>
      <div class="loader-bar"></div>
      <div class="loading-text" style="opacity:0.5">ESTABLISHING SECURE LINK</div>
    </div>`;

  try{
    const url = `${GAS_URL}?date=${encodeURIComponent(date)}&period=${encodeURIComponent(period)}`;
    const res = await fetch(url, {
      method: "GET",
      cache: "no-store",
      redirect: "follow"
    });

    if(!res.ok) throw new Error("HTTP " + res.status);

    const data = await res.json();

    if(!data || data.success !== true) {
      throw new Error(data?.error || "GAS ERROR");
    }

    // Artificial delay for cool loading effect
    await new Promise(resolve => setTimeout(resolve, 800));

    const keyword = String(data.keyword ?? "").trim();

    if(data.found === true && keyword !== ""){
      const [y,m,d] = date.split("-");
      resultDisplay.innerHTML = `
        <div class="result-data">
          <div class="data-meta">✓ ACCESS GRANTED // ${y}.${m}.${d} [P.${period}]</div>
          <div class="data-value" id="decipher-target" data-keyword="${escapeHtml(keyword)}"></div>
          <button class="btn-copy" onclick="copyKeyword('${escapeJs(keyword)}')">COPY TO CLIPBOARD</button>
        </div>`;
        
      // Trigger cool text reveal effect
      const targetEl = document.getElementById("decipher-target");
      playHackerEffect(targetEl, keyword);

    }else{
      resultDisplay.innerHTML = `
        <div class="result-data">
          <div class="error-msg">ERR // NOT_FOUND</div>
          <div class="error-desc">NO DATA REGISTERED FOR GIVEN PARAMETERS.<br>[ ${date} | P.${period} ]</div>
        </div>`;
    }

  }catch(e){
    console.error(e);
    resultDisplay.innerHTML = `
      <div class="result-data">
        <div class="error-msg">ERR // CONNECTION_FAILED</div>
        <div class="error-desc">UNABLE TO REACH SERVER. CHECK NETWORK.</div>
      </div>`;
  }finally{
    searchBtn.disabled = false;
    searchBtn.innerText = "INITIALIZE QUERY // 検索開始";
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function escapeJs(s){
  return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
}

async function copyKeyword(keyword){
  try{
    await navigator.clipboard.writeText(keyword);
    const b = document.querySelector(".btn-copy");
    if(b){ 
      b.textContent = "COPIED SUCCESSFULLY ✓"; 
      b.style.background = "rgba(0, 255, 136, 0.2)";
      b.style.borderColor = "var(--accent-green)";
      b.style.color = "var(--accent-green)";
      setTimeout(()=>{
        b.textContent = "COPY TO CLIPBOARD";
        b.style.background = "transparent";
        b.style.borderColor = "var(--accent-cyan)";
        b.style.color = "var(--accent-cyan)";
      }, 2000); 
    }
  }catch(e){}
}

// Initialize
setToday();
</script>
</body>
</html>
